[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing — every non-asset request returns index.html so React Router
# can take over. Without this, deep-linking to /companies/:id, /perf, etc.
# 404s on direct load and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache index.html so users always get fresh asset hashes after a deploy
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Aggressively cache hashed JS/CSS assets — their filenames change on rebuild
# so it's safe to cache these forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
